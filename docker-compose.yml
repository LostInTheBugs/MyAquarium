services:
  frontend:
    build: .
    container_name: aquarium
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8000}
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.aqua-web.rule=Host(`${DOMAIN:-your-domain.example.com}`) && PathPrefix(`/aquarium`)"
      - "traefik.http.routers.aqua-web.middlewares=aqua-redirect"
      - "traefik.http.middlewares.aqua-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.aqua-redirect.redirectscheme.permanent=true"
      # HTTPS router
      - "traefik.http.routers.aqua-web-secure.rule=Host(`${DOMAIN:-your-domain.example.com}`) && PathPrefix(`/aquarium`)"
      - "traefik.http.routers.aqua-web-secure.tls=true"
      - "traefik.http.routers.aqua-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aqua-web-secure.service=aqua-web"
      # Strip prefix middleware for the backend
      - "traefik.http.middlewares.aqua-strip.stripprefix.prefixes=/aquarium"
      - "traefik.http.routers.aqua-web-secure.middlewares=aqua-strip"
      # Service
      - "traefik.http.services.aqua-web.loadbalancer.server.port=8000"

networks:
  traefik-public:
    external: true
